# ── Next.js reverse proxy ─────────────────────────────────────────────────────
#
# This file contains only the proxy logic.
# SSL certificates and the HTTP→HTTPS redirect are managed by Certbot
# and should not be modified here.
#
# On the server, drop this into the existing Certbot-managed vhost:
#   sudo cp nginx-nextjs.conf /etc/nginx/sites-available/extremeamps
#   sudo nginx -t && sudo systemctl reload nginx
#
# The Certbot-generated SSL block and redirect block are preserved as-is.
# Only the location blocks below need to be present inside the 443 server block.
# ──────────────────────────────────────────────────────────────────────────────

server {
    server_name uat.extremeamps.in;  # update to www.extremeamps.in extremeamps.in for production

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Next.js static assets — long cache, immutable content hashes
    location /_next/static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # All other requests → Next.js
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl;                  # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/uat.extremeamps.in/fullchain.pem;     # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/uat.extremeamps.in/privkey.pem;   # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                             # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                              # managed by Certbot
}

server {
    if ($host = uat.extremeamps.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name uat.extremeamps.in;
    return 404; # managed by Certbot
}
