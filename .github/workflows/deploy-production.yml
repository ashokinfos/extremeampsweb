name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  APP_DIR: /var/www/myapps/production/extremeamps
  ENV_FILE: .env.production

jobs:
  build-and-deploy:
    name: Build & Deploy (Production)
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node ──────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 3. Dependencies ──────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Build ─────────────────────────────────────────────────────────────
      - name: Build (Production)
        run: npm run build

      # ── 5. Install production-only node_modules on CI ───────────────────────
      # Avoids running npm install on the server (wrong Node version / no internet)
      - name: Install production dependencies
        run: npm install --omit=dev

      # ── 7. Package artefact ──────────────────────────────────────────────────
      - name: Create deployment archive
        run: |
          tar -czf deploy.tar.gz \
            .next \
            public \
            node_modules \
            package.json \
            package-lock.json \
            next.config.ts \
            ecosystem.config.cjs \
            ${{ env.ENV_FILE }}

      # ── 8. Upload archive to server ──────────────────────────────────────────
      - name: Upload archive to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CLOUD_SERVER_HOST }}
          username: ${{ secrets.CLOUD_SERVER_USERNAME }}
          key: ${{ secrets.CLOUD_SERVER_SSH_KEY }}
          port: ${{ secrets.CLOUD_SERVER_PORT || 22 }}
          source: "deploy.tar.gz"
          target: "/tmp/extremeamps-production-deploy"

      # ── 9. Remote: unpack and reload PM2 ────────────────────────────────────
      - name: Deploy & restart on production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CLOUD_SERVER_HOST }}
          username: ${{ secrets.CLOUD_SERVER_USERNAME }}
          key: ${{ secrets.CLOUD_SERVER_SSH_KEY }}
          port: ${{ secrets.CLOUD_SERVER_PORT || 22 }}
          script: |
            set -e

            APP_DIR="${{ env.APP_DIR }}"
            DEPLOY_USER="${{ secrets.PRODUCTION_SERVER_USERNAME }}"

            sudo mkdir -p "$APP_DIR"

            # Stop before touching files so Next.js releases route-cache handles
            if pm2 describe extremeamps-production > /dev/null 2>&1; then
              pm2 stop extremeamps-production || true
            fi

            # sudo required — runtime cache files are owned by the PM2 process user
            sudo rm -rf "$APP_DIR/.next"

            # Unpack artefact (node_modules included — no npm install needed)
            sudo tar -xzf /tmp/extremeamps-production-deploy/deploy.tar.gz -C "$APP_DIR"
            rm -f /tmp/extremeamps-production-deploy/deploy.tar.gz

            # Fix ownership AFTER extraction so all unpacked files are accessible
            sudo chown -R "$DEPLOY_USER:$DEPLOY_USER" "$APP_DIR"

            # .env.production is already named correctly — no rename needed

            # Reload or start via PM2
            # --only ensures only the production app is started from the shared ecosystem file
            if pm2 describe extremeamps-production > /dev/null 2>&1; then
              pm2 reload extremeamps-production --update-env
            else
              pm2 start "$APP_DIR/ecosystem.config.cjs" --only extremeamps-production --env production
            fi
            pm2 save

      # ── 10. Local clean-up ───────────────────────────────────────────────────
      - name: Clean up local artefacts
        run: rm -f deploy.tar.gz

      # ── 11. Summary ──────────────────────────────────────────────────────────
      - name: Notify deployment success
        run: echo "✅ Production deployment successful!"
