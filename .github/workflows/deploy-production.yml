name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  APP_DIR: /var/www/myapps/production/extremeamps
  ENV_FILE: .env.production
  APP_NAME: extremeamps-production

jobs:
  build-and-deploy:
    name: Build & Deploy (Production)
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node ──────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 3. Dependencies ──────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Build ─────────────────────────────────────────────────────────────
      # .env.production is already the correct file for this environment —
      # Next.js loads it automatically during `next build` (NODE_ENV=production).
      - name: Build (Production)
        run: npm run build

      # ── 5. Prune dev dependencies ────────────────────────────────────────────
      # Remove devDependencies after build — keeps the archive smaller.
      - name: Prune dev dependencies
        run: npm prune --omit=dev

      # ── 6. Package artefact ──────────────────────────────────────────────────
      - name: Create deployment archive
        run: |
          tar -czf deploy.tar.gz \
            .next \
            public \
            node_modules \
            package.json \
            package-lock.json \
            next.config.ts \
            ecosystem.config.cjs \
            nginx-nextjs.conf \
            ${{ env.ENV_FILE }}

      # ── 7. Upload archive to server ──────────────────────────────────────────
      - name: Upload archive to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CLOUD_SERVER_HOST }}
          username: ${{ secrets.CLOUD_SERVER_USERNAME }}
          key: ${{ secrets.CLOUD_SERVER_SSH_KEY }}
          port: ${{ secrets.CLOUD_SERVER_PORT }}
          source: "deploy.tar.gz"
          target: "/tmp/extremeamps-production-deploy"

      # ── 8. Remote: unpack and reload PM2 ────────────────────────────────────
      - name: Deploy & restart on production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CLOUD_SERVER_HOST }}
          username: ${{ secrets.CLOUD_SERVER_USERNAME }}
          key: ${{ secrets.CLOUD_SERVER_SSH_KEY }}
          port: ${{ secrets.CLOUD_SERVER_PORT }}
          script: |
            set -e

            APP_DIR="${{ env.APP_DIR }}"
            APP_NAME="${{ env.APP_NAME }}"
            DEPLOY_USER="${{ secrets.CLOUD_SERVER_USERNAME }}"

            # Ensure app directory exists
            sudo mkdir -p "$APP_DIR"

            # Stop the app before touching files so Next.js releases
            # route-cache file handles (owned by the PM2 process user)
            if pm2 describe "$APP_NAME" > /dev/null 2>&1; then
              pm2 stop "$APP_NAME" || true
            fi

            # Remove old .next — needs sudo as runtime cache files
            # are owned by the user Next.js ran as
            sudo rm -rf "$APP_DIR/.next"

            # Unpack artefact (node_modules included — no npm install needed)
            sudo tar -xzf /tmp/extremeamps-production-deploy/deploy.tar.gz -C "$APP_DIR"
            rm -f /tmp/extremeamps-production-deploy/deploy.tar.gz

            # Fix ownership AFTER extraction so all files are accessible
            sudo chown -R "$DEPLOY_USER:$DEPLOY_USER" "$APP_DIR"

            # .env.production is already correctly named — no rename needed

            # Update nginx config (validate before reloading to avoid downtime)
            sudo cp "$APP_DIR/nginx-nextjs.conf" /etc/nginx/sites-available/extremeamps
            sudo ln -sf /etc/nginx/sites-available/extremeamps /etc/nginx/sites-enabled/extremeamps
            sudo nginx -t && sudo systemctl reload nginx

            # Always do a clean start — delete if exists, then start fresh.
            # Avoids any pm2 describe state-check issues.
            pm2 delete "$APP_NAME" || true
            pm2 start "$APP_DIR/ecosystem.config.cjs" --only "$APP_NAME" --env deploy
            pm2 save

      # ── 9. Local clean-up ───────────────────────────────────────────────────
      - name: Clean up local artefacts
        run: rm -f deploy.tar.gz

      # ── 10. Summary ──────────────────────────────────────────────────────────
      - name: Notify deployment success
        run: echo "✅ Production deployment successful!"
