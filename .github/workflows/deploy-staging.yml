name: Deploy to Staging

on:
  workflow_dispatch:
  push:
    branches:
      - develop

env:
  APP_DIR: /var/www/myapps/staging/extremeamps
  ENV_FILE: .env.staging

jobs:
  build-and-deploy:
    name: Build & Deploy (Staging)
    runs-on: ubuntu-latest
    environment: staging

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node ──────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 3. Write env file from GitHub secret ────────────────────────────────
      # In GitHub: Settings → Environments → staging → Add secret
      # Secret name: ENV_FILE
      # Secret value: paste the full contents of your staging .env file
      - name: Write .env.staging from secret
        run: echo "${{ secrets.ENV_FILE }}" > ${{ env.ENV_FILE }}

      # ── 3a. Load env vars into workflow environment (for build-time baking) ──
      - name: Load staging environment variables
        run: |
          grep -v '^\s*#' ${{ env.ENV_FILE }} | grep -v '^\s*$' >> $GITHUB_ENV

      # ── 4. Dependencies ──────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 5. Build ─────────────────────────────────────────────────────────────
      - name: Build (Staging)
        run: npm run build

      # ── 6. Install production-only node_modules on CI ───────────────────────
      # Avoids running npm install on the server (wrong Node version / no internet)
      - name: Install production dependencies
        run: npm install --omit=dev

      # ── 7. Package artefact ──────────────────────────────────────────────────
      - name: Create deployment archive
        run: |
          tar -czf deploy.tar.gz \
            .next \
            public \
            node_modules \
            package.json \
            package-lock.json \
            next.config.ts \
            ecosystem.config.cjs \
            ${{ env.ENV_FILE }}

      # ── 8. Upload archive to server ──────────────────────────────────────────
      - name: Upload archive to staging server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CLOUD_SERVER_HOST }}
          username: ${{ secrets.CLOUD_SERVER_USERNAME }}
          key: ${{ secrets.CLOUD_SERVER_SSH_KEY }}
          port: ${{ secrets.CLOUD_SERVER_PORT || 22 }}
          source: "deploy.tar.gz"
          target: "/tmp/extremeamps-staging-deploy"

      # ── 9. Remote: unpack and reload PM2 ────────────────────────────────────
      - name: Deploy & restart on staging server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CLOUD_SERVER_HOST }}
          username: ${{ secrets.CLOUD_SERVER_USERNAME }}
          key: ${{ secrets.CLOUD_SERVER_SSH_KEY }}
          port: ${{ secrets.CLOUD_SERVER_PORT || 22 }}
          script: |
            set -e

            APP_DIR="${{ env.APP_DIR }}"
            DEPLOY_USER="${{ secrets.STAGING_SERVER_USERNAME }}"

            sudo mkdir -p "$APP_DIR"

            if pm2 describe extremeamps-staging > /dev/null 2>&1; then
              pm2 stop extremeamps-staging || true
            fi

            sudo rm -rf "$APP_DIR/.next"

            # Unpack artefact (node_modules included — no npm install needed)
            sudo tar -xzf /tmp/extremeamps-staging-deploy/deploy.tar.gz -C "$APP_DIR"
            sudo rm -f /tmp/extremeamps-staging-deploy/deploy.tar.gz

            # Fix ownership of everything AFTER extraction so all files
            # (including newly unpacked ones) are owned by the deploy user
            sudo chown -R "$DEPLOY_USER:$DEPLOY_USER" "$APP_DIR"

            # Place the env file where Next.js expects it
            sudo cp "$APP_DIR/${{ env.ENV_FILE }}" "$APP_DIR/.env.production"

            # Reload or start via PM2
            if pm2 describe extremeamps-staging > /dev/null 2>&1; then
              sudo pm2 reload extremeamps-staging --update-env
            else
              sudo pm2 start "$APP_DIR/ecosystem.config.cjs" --env production --name extremeamps-staging
            fi
            sudo pm2 save

      # ── 10. Local clean-up ───────────────────────────────────────────────────
      - name: Clean up local artefacts
        run: sudo rm -f deploy.tar.gz

      # ── 11. Summary ──────────────────────────────────────────────────────────
      - name: Notify deployment success
        run: echo "✅ Staging deployment successful!"
